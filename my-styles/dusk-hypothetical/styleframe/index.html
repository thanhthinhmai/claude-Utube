<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/core/fonts/fonts.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block}
  .bar{position:fixed;left:0;right:0;height:6.67vh;background:#000;z-index:3}
  #top{top:0} #bot{bottom:0}
  #cap{position:fixed;top:12vh;left:0;right:0;text-align:center;z-index:2;font:400 3.6vh 'IM Fell English',serif;letter-spacing:.32em;color:#f3d9a6;text-shadow:0 0 1.4vh rgba(255,200,120,.65)}
  .tag{position:fixed;z-index:2;font:600 1.5vh 'Fredoka',sans-serif;color:#f6e4bd;border:.18vh solid #d9b26a;border-radius:3vh;padding:.5vh 1.3vh;background:rgba(30,18,40,.65);box-shadow:0 0 1vh rgba(230,180,90,.45);text-align:center;line-height:1.1}
  .tag b{display:block;font-size:2.4vh}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div class="bar" id="top"></div><div class="bar" id="bot"></div>
<div id="cap">LAST LOAD</div>
<div class="tag" id="t1" style="left:30%;top:22%">SPIN<b>12</b></div>
<div class="tag" id="t2" style="left:72%;top:24%">DRY<b>48</b></div>
<script type="module">
import * as THREE from 'three';
import { makePost } from '/core/three/post.js';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const view = document.createElement('canvas'); view.width = W; view.height = H; document.body.appendChild(view);
const vctx = view.getContext('2d');   // the capture tool can't read a software WebGL layer: copy each frame here
const scene = new THREE.Scene();
scene.background = new THREE.Color('#3a2a52');
scene.fog = new THREE.Fog('#2a1c40', 9, 26);
const cam = new THREE.PerspectiveCamera(42, W / H, 0.05, 60);

const mat = (c, r = .92) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0 });
const box = (w, h, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };

// room
box(30, .1, 20, '#7a6070', 0, -.05, 0);                       // floor, dusty rose-brown
box(30, 6, .2, '#5a4778', 0, 3, -5);                          // back wall
// windows: dusk sky gradient on a plane behind the wall openings
const sky = document.createElement('canvas'); sky.width = 4; sky.height = 256;
const g = sky.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
gr.addColorStop(0, '#5a3e86'); gr.addColorStop(.55, '#b46a9a'); gr.addColorStop(.85, '#f0a77c'); gr.addColorStop(1, '#f6c28a');
g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
const skyM = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sky), fog: false });
skyM.map.colorSpace = THREE.SRGBColorSpace;
for (let i = -3; i <= 3; i++) {
  const x = i * 3.2;
  const win = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6), skyM); win.position.set(x, 3.2, -4.88); scene.add(win);
  box(.12, 2.7, .1, '#4a3866', x, 3.2, -4.82); box(2.7, .12, .1, '#4a3866', x, 3.2, -4.82);
  // city silhouettes in each window
  for (let k = 0; k < 4; k++) { const h = .5 + ((i * 7 + k * 13) % 9) / 9 * 1.1; const b = new THREE.Mesh(new THREE.PlaneGeometry(.45, h), new THREE.MeshBasicMaterial({ color: '#5a4274', fog: false })); b.position.set(x - .95 + k * .62, 1.9 + h / 2, -4.86); scene.add(b); }
}
// washing machines along the back
for (let i = -5; i <= 5; i++) {
  const x = i * 1.15;
  box(1.05, 1.1, .9, '#aaa0c2', x, .55, -4.3);
  const door = new THREE.Mesh(new THREE.CylinderGeometry(.33, .33, .05, 32), mat('#2c2240', .4));
  door.rotation.x = Math.PI / 2; door.position.set(x, .6, -3.84); scene.add(door);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(.26, 32), new THREE.MeshBasicMaterial({ color: i % 3 ? '#4a3d6e' : '#9fd0ff' }));
  glow.position.set(x, .6, -3.81); scene.add(glow);
}
// folding table
box(3.2, .08, 1.1, '#a07862', 1.3, .85, -.2); box(.08, .85, .08, '#5a4660', -.2, .42, .2); box(.08, .85, .08, '#5a4660', 2.8, .42, .2);
box(.7, .3, .5, '#6b5fa8', 1.7, 1.04, -.2);                  // basket
// figure: sphere head, hoodie, stick limbs, mitten hands, dot eyes
function figure(x, z, s, hoodie, ry, eyes = 'dot') {
  const f = new THREE.Group(); f.position.set(x, 0, z); f.rotation.y = ry; f.scale.setScalar(s); scene.add(f);
  const skin = new THREE.MeshStandardMaterial({ color: '#f1ebf2', roughness: .55 });
  const add = (geo, m, px, py, pz) => { const o = new THREE.Mesh(geo, m); o.position.set(px, py, pz); o.castShadow = true; f.add(o); return o; };
  add(new THREE.SphereGeometry(.42, 48, 32), skin, 0, 1.62, 0);                         // head
  add(new THREE.CylinderGeometry(.05, .05, .2, 12), skin, 0, 1.15, 0);                  // neck
  add(new THREE.CapsuleGeometry(.26, .32, 6, 16), mat(hoodie, .95), 0, .82, 0);          // hoodie
  add(new THREE.SphereGeometry(.17, 20, 12), mat(hoodie, .95), 0, 1.08, -.12);           // hood
  for (const sx of [-1, 1]) {
    const leg = add(new THREE.CylinderGeometry(.045, .045, .5, 10), skin, sx * .1, .3, 0);
    add(new THREE.SphereGeometry(.08, 12, 8), skin, sx * .11, .05, .05);                // foot
    const arm = add(new THREE.CylinderGeometry(.04, .04, .42, 10), skin, sx * .33, .78, 0); arm.rotation.z = sx * .25;
    add(new THREE.SphereGeometry(.075, 12, 8), skin, sx * .38, .55, .02);               // mitten
  }
  const ink = new THREE.MeshBasicMaterial({ color: '#120c1a' });
  for (const sx of [-1, 1]) {
    const e = add(new THREE.SphereGeometry(eyes === 'dot' ? .045 : .06, 12, 8), ink, sx * .14, 1.68, .39);
    e.scale.set(1, eyes === 'dot' ? 1.25 : .28, .3);
    const brow = add(new THREE.BoxGeometry(.13, .018, .01), ink, sx * .15, 1.82, .38); brow.rotation.z = -sx * .18;
  }
  return f;
}
figure(-.1, -1.2, 1.1, '#d9d24a', .35);              // yellow hoodie, mid
figure(2.9, -1.6, 1.05, '#3f7fd6', -.5, 'lid');      // blue hoodie, half-closed lids
const fg = figure(-1.05, 1.9, 1.15, '#4c6fb8', 2.6); // foreground head, blurred by DOF

// lights: warm pink key from the windows' side, violet fill
scene.add(new THREE.HemisphereLight('#a48ad6', '#6a4658', 2.2));
const key = new THREE.DirectionalLight('#ffb08a', 2.1); key.position.set(-6, 7, -2); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.intensity = .55; Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(key);
const rim = new THREE.PointLight('#ff8fb0', 6, 9); rim.position.set(1, 3.5, -3.6); scene.add(rim);
const lamp = new THREE.PointLight('#9fd0ff', 2.5, 4); lamp.position.set(0, .8, -3.2); scene.add(lamp);
const low = new THREE.PointLight('#c79ad8', 5, 14); low.position.set(-.5, .6, 3); scene.add(low);   // lifts the low wall band and the foreground head

const post = makePost(renderer, scene, cam, W, H, { ssaa: 1, ao: false });
post.dof.focus = 5.2; post.dof.aper = 26; post.dof.maxCoc = 14;
post.vig.uniforms.amt.value = .42; post.vig.uniforms.sat.value = .72; post.vig.uniforms.contrast.value = 0.25;
post.bloom.strength = .25;

window.DUR = 2;
window.render = (t) => {
  const k = t / window.DUR, z = 4.2 - .35 * k;     // slow push-in
  cam.position.set(.2, 1.75, z); cam.lookAt(.9, 1.3, -3);
  post.composer.render(); vctx.drawImage(renderer.domElement, 0, 0, W, H);
};
document.fonts.ready.then(() => { window.render(0); window.READY = true; });
</script></body></html>

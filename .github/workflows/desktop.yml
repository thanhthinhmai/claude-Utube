# The desktop shell on real Windows and macOS (specs/015 R4, FR-016): the logic tests, then a smoke run of the app with
# a fake studio core (GitHub's Windows machines have no WSL2). Runs on desktop branches and by hand only, to save minutes.
name: desktop
on:
  push:
    branches: ["[0-9][0-9][0-9]-desktop-*"]
    paths: ["desktop/**", "!desktop/core-build/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/*.test.js
      - name: smoke run (fake core; sharing with the team, specs/018)
        shell: bash
        env:
          CU_CORE_CMD: '["node","test/fake-core.mjs"]'
          CU_SMOKE_SHARE: "1"
        run: |
          export CU_CONFIG_DIR="$RUNNER_TEMP/cu-config"
          npx electron . --smoke 2>&1 | tee smoke.log
          for line in "setup ok" "window ok" "share pair ok" "external ok" "second instance ok" "hide ok" "stopped ok" "quit cancel ok" "quit ok"; do
            grep -q "smoke: $line" smoke.log || { echo "missing: smoke: $line"; exit 1; }
          done
          ! grep -q "smoke: fail" smoke.log
      - name: smoke run of the license (fake license server, specs/017)
        shell: bash
        env:
          CU_CORE_CMD: '["node","test/fake-core.mjs"]'
          CU_SMOKE_NO_SETUP: "1"
          CU_LICENSE_SERVER: http://127.0.0.1:8911
          CU_SMOKE_KEY: CU-TEST-TEST-TEST-TEST
        run: |
          node test/fake-license.mjs 8911 > fake-license.log 2>&1 &
          sleep 1
          export CU_CONFIG_DIR="$RUNNER_TEMP/cu-config-license"
          export CU_LICENSE_PUBLIC_KEY=$(node -p "require('./test/vectors/vectors.json').public")
          npx electron . --smoke --smoke-license 2>&1 | tee license.log
          for line in "license ok" "window ok" "locked ok" "quit ok"; do grep -q "smoke: $line" license.log || { echo "missing: smoke: $line"; exit 1; }; done
          ! grep -q "smoke: fail" license.log
      - name: smoke run of the Client mode (fake Host, specs/018)
        shell: bash
        run: |
          rel="$RUNNER_TEMP/client-release"; mkdir -p "$rel"; printf 'x' > "$rel/claude-Utube-Setup-9.9.9.exe"; printf 'x' > "$rel/claude-Utube-9.9.9-arm64.dmg"
          node test/sign-release.mjs "$rel" 9.9.9
          node test/fake-license.mjs 8921 "$rel" > fake-license-client.log 2>&1 &
          sleep 1
          node test/fake-host.mjs 47871 47872 "$RUNNER_TEMP/pair.txt" http://127.0.0.1:8921 > fake-host.log 2>&1 &
          sleep 2
          export CU_CONFIG_DIR="$RUNNER_TEMP/cu-config-client" CU_SMOKE_PAIR="$(cat "$RUNNER_TEMP/pair.txt")" CU_SMOKE_CONTROL=http://127.0.0.1:47872
          export CU_SMOKE_UPDATE=1 CU_LICENSE_SERVER=http://127.0.0.1:8921 CU_LICENSE_PUBLIC_KEY=$(node -p "require('./test/vectors/vectors.json').public")
          npx electron . --smoke --smoke-client 2>&1 | tee client.log
          for line in "pair ok" "window ok" "update ready ok" "offline ok" "quit ok"; do grep -q "smoke: $line" client.log || { echo "missing: smoke: $line"; cat fake-host.log; exit 1; }; done
          ! grep -q "smoke: fail" client.log
      - name: smoke run of the install screen (fake studio package, specs/016)
        shell: bash
        env:
          CU_CORE_CMD: '["node","test/fake-core.mjs"]'
          CU_FAKE_INSTALL: "1"
        run: |
          node test/fake-package.mjs "$RUNNER_TEMP/pkg"
          export CU_CONFIG_DIR="$RUNNER_TEMP/cu-config-install" CU_PACKAGED_DIR="$RUNNER_TEMP/pkg"
          npx electron . --smoke 2>&1 | tee install.log
          for line in "install ok" "window ok" "quit ok"; do grep -q "smoke: $line" install.log || { echo "missing: smoke: $line"; exit 1; }; done
          ! grep -q "smoke: fail" install.log
      - name: build the installer (fake studio package, test license) and run the packed app
        shell: bash
        env:
          CU_CORE_CMD: '["node","test/fake-core.mjs"]'
          CU_FAKE_INSTALL: "1"
          CU_SMOKE_KEY: CU-TEST-TEST-TEST-TEST
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then os=linux; flag=--win; else os=mac; flag=--mac; fi
          node test/fake-package.mjs "../dist/core/$os"
          # this build checks licenses against the fake server and the TEST key (never a real key)
          echo '{"licenseServer": "http://127.0.0.1:8913"}' > build-config.json
          node -p "require('./test/vectors/vectors.json').public" > license-public-key.txt
          npx electron-builder $flag --publish never
          ls -la ../dist/installers
          if [ "$RUNNER_OS" = Windows ]; then exe="../dist/installers/win-unpacked/claude-Utube.exe"; inst=$(ls ../dist/installers/*.exe | head -1)
          else exe="../dist/installers/mac-arm64/claude-Utube.app/Contents/MacOS/claude-Utube"; inst=$(ls ../dist/installers/*.dmg | head -1); fi
          # a "newer" release made of this very installer, signed with the TEST key (specs/017 T020)
          rel="$RUNNER_TEMP/release"; mkdir -p "$rel"
          if [ "$RUNNER_OS" = Windows ]; then cp "$inst" "$rel/claude-Utube-Setup-9.9.9.exe"; else cp "$inst" "$rel/claude-Utube-9.9.9-arm64.dmg"; fi
          node test/sign-release.mjs "$rel" 9.9.9
          node test/fake-license.mjs 8913 "$rel" > fake-license-packed.log 2>&1 &
          sleep 1
          export CU_CONFIG_DIR="$RUNNER_TEMP/cu-config-packed"
          "$exe" --smoke 2>&1 | tee packed.log
          for line in "license ok" "install ok" "window ok" "quit ok"; do grep -q "smoke: $line" packed.log || { echo "missing: smoke: $line"; exit 1; }; done
          export CU_CONFIG_DIR="$RUNNER_TEMP/cu-config-update" CU_SMOKE_NO_SETUP=1
          "$exe" --smoke --smoke-update 2>&1 | tee update.log
          # the key is kept from the run above (Keychain on macOS), so no "license ok" here
          for line in "update ready ok" "quit ok"; do grep -q "smoke: $line" update.log || { echo "missing: smoke: $line"; exit 1; }; done
          ! grep -q "smoke: fail" packed.log update.log
          if [ "$RUNNER_OS" = Windows ]; then
            inst="$LOCALAPPDATA/Programs/claude-Utube/claude-Utube.exe"
            for i in $(seq 1 60); do
              [ -f "$inst" ] && break
              powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'claude|Setup|Un_' } | ForEach-Object { '{0} {1} {2}' -f \$_.ProcessId, \$_.Name, \$_.CommandLine }" | head -8
              echo "--- $i"; sleep 3
            done
            [ -f "$inst" ] || { echo "the silent install did not put the app in $inst"; exit 1; }
            sleep 10
          fi
      - name: the downloaded installer installs the app silently and starts it (Windows, specs/017 R6)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\claude-Utube\claude-Utube.exe"
          for ($i = 0; $i -lt 90 -and -not (Test-Path $exe); $i++) { Start-Sleep 2 }
          if (-not (Test-Path $exe)) {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'claude|Setup|powershell' } | Format-Table ProcessId,Name,CommandLine -AutoSize | Out-String -Width 400
            Write-Error "the silent install did not put the app in $exe"; exit 1
          }
          for ($i = 0; $i -lt 30 -and -not (Get-Process claude-Utube -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }); $i++) { Start-Sleep 2 }
          $running = Get-Process claude-Utube -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          if (-not $running) { Write-Error "the installed app was not started again"; exit 1 }
          "installed and started: $exe"
          Get-Process claude-Utube -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'fake-core' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      - name: no fake core left (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'fake-core' }
          if ($left) { $left | Format-List ProcessId,CommandLine; exit 1 }
      - name: no fake core left (macOS)
        if: runner.os == 'macOS'
        run: "! pgrep -fl fake-core"

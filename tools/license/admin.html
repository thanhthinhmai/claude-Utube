<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-Utube licenses</title>
<style>
  :root { --bg: #f7f7fb; --panel: #fff; --fg: #20223a; --muted: #6b6f85; --line: #e3e4ee; --accent: #4b55d6; --ok: #1b7f3b; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17182a; --panel: #212238; --fg: #ecedf5; --muted: #a3a6bd; --line: #33354f; --accent: #8c94ff; --ok: #6fd28f; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 12px; } h2 { font-size: 15px; margin: 20px 0 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin: 8px 0 4px; }
  input, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0 12px; }
  button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 0; } button.danger { color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  .muted { color: var(--muted); } .active { color: var(--ok); } .revoked, .expired { color: var(--bad); }
  .key { font: 600 18px/1.4 ui-monospace, monospace; background: var(--bg); padding: 8px 10px; border-radius: 6px; word-break: break-all; }
  #msg { min-height: 20px; } [hidden] { display: none !important; }
  details summary { cursor: pointer; color: var(--accent); }
</style></head>
<body><main>
  <h1>claude-Utube licenses</h1>
  <section id="signin" class="panel" hidden>
    <label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button class="primary" id="login">Sign in</button></div>
  </section>
  <section id="app" hidden>
    <div class="panel">
      <h2 style="margin-top:0">New key</h2>
      <div class="grid">
        <div><label for="label">Person or team</label><input id="label" maxlength="80"></div>
        <div><label for="max">Computers</label><input id="max" type="number" min="1" max="20" value="1"></div>
        <div><label for="exp">Ends on <span class="muted">(empty: never)</span></label><input id="exp" type="date"></div>
      </div>
      <label for="note">Note</label><input id="note" maxlength="500">
      <div class="row"><button class="primary" id="create">Create key</button></div>
      <div id="newkey" hidden><p>Send this key to the person. It is shown <b>only now</b>.</p>
        <div class="key" id="keytext"></div><div class="row"><button id="copy">Copy</button></div></div>
    </div>
    <div class="panel wrap"><table><thead><tr><th>Person</th><th>Status</th><th>Computers</th><th>Ends</th><th>Last seen</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <div class="row"><button id="logout">Sign out</button></div>
  </section>
  <p id="msg" role="status"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const day = (t) => t ? new Date(t * 1000).toISOString().slice(0, 10) : "—";
  const when = (t) => t ? new Date(t * 1000).toLocaleString() : "—";
  let list = [];
  async function api(method, path, body) {
    const r = await fetch("/admin/api" + path, { method, headers: { "content-type": "application/json", "x-cu-admin": "1" },
      body: body === undefined ? undefined : JSON.stringify(body), credentials: "same-origin" });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== "/login") { show(false); throw new Error("Signed out"); }
    if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
    return j;
  }
  function show(signedIn) { $("signin").hidden = signedIn; $("app").hidden = !signedIn; }
  function render() {
    $("rows").innerHTML = list.map((l) => {
      const used = l.devices.filter((d) => !d.removedAt).length;
      const seen = Math.max(0, ...l.devices.map((d) => d.lastSeenAt || 0));
      const devs = l.devices.map((d) => `<li>${esc(d.name || "computer")} · ${esc(d.os)} · v${esc(d.version)} · ${esc(d.lastIp)} · seen ${when(d.lastSeenAt)}
        ${d.removedAt ? '<span class="revoked">removed</span>' : ""}
        <button data-act="dev" data-id="${l.id}" data-dev="${d.deviceId}">${d.removedAt ? "Allow again" : "Remove"}</button></li>`).join("");
      return `<tr><td><b>${esc(l.label)}</b> <span class="muted">…${esc(l.last4)}</span><br><span class="muted">${esc(l.note)}</span>
          ${l.devices.length ? `<details><summary>${l.devices.length} computer(s)</summary><ul>${devs}</ul></details>` : ""}</td>
        <td class="${l.status}">${l.status}</td><td>${used} of ${l.maxDevices}</td><td>${day(l.expiresAt)}</td><td>${when(seen || null)}</td>
        <td><button data-act="edit" data-id="${l.id}">Edit</button>
          <button data-act="revoke" data-id="${l.id}">${l.revokedAt ? "Turn on" : "Turn off"}</button>
          <button class="danger" data-act="delete" data-id="${l.id}">Delete</button></td></tr>`;
    }).join("") || `<tr><td colspan="6" class="muted">No keys yet.</td></tr>`;
  }
  async function load() { const j = await api("GET", "/licenses"); list = j.licenses; render(); show(true); }
  const run = (fn) => async (e) => { try { $("msg").textContent = ""; await fn(e); } catch (x) { $("msg").textContent = x.message; } };
  $("login").onclick = run(async () => { await api("POST", "/login", { password: $("pw").value }); $("pw").value = ""; await load(); });
  $("pw").onkeydown = (e) => { if (e.key === "Enter") $("login").click(); };
  $("logout").onclick = run(async () => { await api("POST", "/logout"); show(false); });
  $("create").onclick = run(async () => {
    const exp = $("exp").value ? Math.floor(new Date($("exp").value + "T23:59:59").getTime() / 1000) : null;
    const j = await api("POST", "/licenses", { label: $("label").value, note: $("note").value, maxDevices: Number($("max").value), expiresAt: exp });
    list = j.licenses; render();
    $("keytext").textContent = j.key; $("newkey").hidden = false; $("label").value = $("note").value = $("exp").value = "";
  });
  $("copy").onclick = () => navigator.clipboard.writeText($("keytext").textContent).then(() => { $("msg").textContent = "Copied."; });
  $("rows").onclick = run(async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const l = list.find((x) => x.id === b.dataset.id);
    if (b.dataset.act === "revoke") list = (await api("PATCH", `/licenses/${l.id}`, { revoked: !l.revokedAt })).licenses;
    if (b.dataset.act === "delete" && confirm(`Delete the key of ${l.label}? Its computers stop working.`)) list = (await api("DELETE", `/licenses/${l.id}`)).licenses;
    if (b.dataset.act === "dev") list = (await api("DELETE", `/licenses/${l.id}/devices/${b.dataset.dev}`)).licenses;
    if (b.dataset.act === "edit") {
      const label = prompt("Person or team", l.label); if (label === null) return;
      const max = Number(prompt("Computers (1–20)", String(l.maxDevices))); if (!max) return;
      const ends = prompt("Ends on (YYYY-MM-DD, empty for never)", l.expiresAt ? day(l.expiresAt) : ""); if (ends === null) return;
      const note = prompt("Note", l.note); if (note === null) return;
      list = (await api("PATCH", `/licenses/${l.id}`, { label, note, maxDevices: max,
        expiresAt: ends ? Math.floor(new Date(ends + "T23:59:59").getTime() / 1000) : null })).licenses;
    }
    render();
  });
  load().catch(() => show(false));
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>claude-Utube</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --bg: #f7f7fb; --fg: #20223a; --muted: #6b6f85; --accent: #4b55d6; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17182a; --fg: #ecedf5; --muted: #a3a6bd; --accent: #8c94ff; --bad: #ff8a80; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); -webkit-app-region: drag; }
  .box { width: 380px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 18px; margin: 10px 0 4px; }
  #step { color: var(--muted); min-height: 20px; }
  .bar { height: 4px; background: #0001; border-radius: 2px; overflow: hidden; margin: 14px 0; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: go 1.2s infinite ease-in-out; }
  @keyframes go { from { margin-left: -40%; } to { margin-left: 100%; } }
  #err { display: none; text-align: left; }
  #err pre { white-space: pre-wrap; font-size: 11px; max-height: 110px; overflow: auto; background: #0001; padding: 6px; border-radius: 4px; color: var(--bad); }
  button { -webkit-app-region: no-drag; margin: 4px; padding: 6px 12px; border-radius: 6px; border: 1px solid #0002; background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 0; }
</style></head>
<body><div class="box">
  <img src="assets/icon.png" alt=""><h1>claude-Utube</h1>
  <div id="ok"><div id="step">Checking…</div><div class="bar"><i></i></div></div>
  <div id="err"><p><strong>The studio did not start.</strong></p><pre id="why"></pre>
    <button class="primary" onclick="core.retry()">Try again</button><button onclick="core.openLogs()">Open the log folder</button><button onclick="core.quit()">Quit</button></div>
</div>
<script>
  function setStep(t) { document.getElementById("step").textContent = t; }
  function showError(t) { document.getElementById("ok").style.display = "none"; document.getElementById("err").style.display = "block"; document.getElementById("why").textContent = t; }
</script></body></html>

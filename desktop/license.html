<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>claude-Utube license</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --bg: #f7f7fb; --panel: #fff; --fg: #20223a; --muted: #6b6f85; --line: #e3e4ee; --accent: #4b55d6; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17182a; --panel: #212238; --fg: #ecedf5; --muted: #a3a6bd; --line: #33354f; --accent: #8c94ff; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { padding: 24px 22px; } h1 { font-size: 20px; margin: 0 0 6px; } p { margin: 0 0 12px; }
  .muted { color: var(--muted); } .bad { color: var(--bad); }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg);
    font: 600 16px/1.4 ui-monospace, monospace; letter-spacing: .04em; }
  button { margin-top: 12px; padding: 9px 18px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; } #msg { min-height: 22px; margin-top: 10px; } [hidden] { display: none !important; }
</style></head>
<body><main>
  <h1 id="title">Enter your license key</h1>
  <p id="lead" class="muted">The studio owner gives you a key like CU-XXXX-XXXX-XXXX-XXXX.</p>
  <p id="info" hidden></p>
  <label for="key" class="muted">License key</label>
  <input id="key" spellcheck="false" autocomplete="off" placeholder="CU-XXXX-XXXX-XXXX-XXXX">
  <button id="go">Continue</button>
  <p id="msg" role="status"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  async function show(mode) {
    const s = await license.state();
    $("title").textContent = mode === "locked" ? "claude-Utube is locked" : mode === "info" ? "License" : "Enter your license key";
    $("lead").textContent = mode === "locked" ? "Films that were running finish; nothing new starts. Your data is kept. Enter a valid key to go on."
      : mode === "info" ? "You can replace the key here." : "The studio owner gives you a key like CU-XXXX-XXXX-XXXX-XXXX.";
    $("info").hidden = !s.label;
    $("info").textContent = s.label ? `Licensed to ${s.label}` + (s.expires ? ` · until ${new Date(s.expires * 1000).toISOString().slice(0, 10)}` : "") : "";
    $("msg").className = s.message && mode !== "info" ? "bad" : "";
    $("msg").textContent = mode !== "info" && s.problem && s.problem !== "signature" ? s.message : "";
  }
  $("go").onclick = async () => {
    $("go").disabled = true; $("msg").className = ""; $("msg").textContent = "Checking…";
    const r = await license.submit($("key").value);
    $("go").disabled = false;
    if (!r.ok) { $("msg").className = "bad"; $("msg").textContent = r.error; }
  };
  $("key").onkeydown = (e) => { if (e.key === "Enter") $("go").click(); };
  license.onMode(show);
  show(new URLSearchParams(location.search).get("mode") || "needed");
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>claude-Utube</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --bg: #f7f7fb; --fg: #20223a; --muted: #6b6f85; --line: #e3e4ee; --accent: #4b55d6; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17182a; --fg: #ecedf5; --muted: #a3a6bd; --line: #33354f; --accent: #8c94ff; --bad: #ff8a80; } }
  body { margin: 0; font: 15px/1.6 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 560px; margin: 14vh auto; padding: 0 16px; } h1 { font-size: 22px; }
  .muted { color: var(--muted); } .bad { color: var(--bad); }
  button { margin: 14px 8px 0 0; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 0; }
</style></head>
<body><main>
  <h1 id="title">Cannot reach the studio</h1>
  <p id="text" class="muted"></p>
  <button class="primary" id="retry">Try again</button><button id="setup">Change address…</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const address = q.get("address") || "";
  if (q.get("why") === "mismatch") {
    document.getElementById("title").textContent = "This is not the studio you paired with";
    document.getElementById("text").innerHTML = `Another computer answers at <b></b>. Nothing was sent to it. If the studio owner moved the studio, pair again.`;
  } else {
    document.getElementById("text").innerHTML = `The studio at <b></b> does not answer. Check that the studio computer is on, that it is sharing,
      and that both computers are on the same network (or Tailscale). On macOS, allow claude-Utube in System Settings → Privacy &amp; Security → Local Network.`;
  }
  document.querySelector("#text b").textContent = address;
  document.getElementById("retry").onclick = () => client.retry();
  document.getElementById("setup").onclick = () => client.setup();
</script></body></html>

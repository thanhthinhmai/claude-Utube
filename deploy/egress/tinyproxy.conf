Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Notice
# only reachable on the internal jobnet-yt network
Allow 0.0.0.0/0
DisableViaHeader Yes
# the target host must match a line of allow.txt (regular expressions); all else is denied
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs Off
Filter "/etc/tinyproxy/allow.txt"
ConnectPort 443
